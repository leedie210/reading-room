<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频预览</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#0f141c;color:#edf2f8;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1060px;margin:28px auto;padding:0 24px}header{display:flex;justify-content:space-between;gap:16px}h1{font-size:24px;line-height:1.45;margin:8px 0 20px;overflow-wrap:anywhere}.eyebrow{color:#8cbcff;font-size:13px}#stage{position:relative;display:flex;align-items:center;justify-content:center;background:#06080b;min-height:260px;border-radius:14px;overflow:hidden}video{display:none;width:100%;max-height:62vh;object-fit:contain}#cover{display:block;max-width:100%;max-height:62vh;object-fit:contain}audio{display:none}button,a.action{border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.primary{background:#90bdff;color:#11213b;font-weight:650}button.secondary,a.action{background:#293443;color:#edf2f8}button:disabled{opacity:.5;cursor:default}#play{position:absolute;border:1px solid #ffffff3a;background:#111d;color:white;font-size:19px}input,select{background:#111c2a;color:#edf2f8;border:1px solid #485770;border-radius:6px;padding:8px;font:inherit}input{width:135px}label{display:inline-flex;gap:7px;align-items:center}.row,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions{margin:18px 0 8px}.panel{background:#18212d;border:1px solid #2f3d50;border-radius:12px;padding:16px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 10px}.hint{font-size:13px;color:#a6b3c6}.hint p{margin:6px 0}#message{min-height:26px;color:#aecdfb;margin-top:10px}#empty{padding:70px 20px;color:#a6b3c6;text-align:center}#roi-layer{position:absolute;touch-action:none;cursor:crosshair;z-index:2;pointer-events:none}#roi-box{position:absolute;border:2px solid #7eddd0;background:#7eddd01d;pointer-events:none}#roi-box:after{content:'字幕区域';position:absolute;left:0;top:-25px;white-space:nowrap;background:#143d3e;color:#c7fff8;padding:0 5px;font-size:13px}@media(max-width:650px){main{margin-top:18px;padding:0 12px}h1{font-size:20px}button,a.action{padding:9px 12px}input{width:115px}}
</style>
<main><header><span class="eyebrow" id="platform">视频预览</span><span class="hint">先看，再决定</span></header>
<h1 id="title">正在加载…</h1>
<div class="actions" id="learning-nav" hidden><span class="hint">视频</span><a href="reading" class="action">双语阅读</a><a id="return-reading" href="reading" class="action" hidden>返回原文段落</a><label class="hint"><input id="english" type="checkbox" style="width:18px;height:18px">作为英语学习素材</label></div>
<div id="stage"><img id="cover" hidden alt="视频封面"><video id="video" controls playsinline preload="none"></video><audio id="audio" preload="none"></audio><div id="empty">正在读取封面…</div><button id="play" hidden>▶ 播放预览</button><div id="roi-layer" hidden><div id="roi-box" hidden></div></div></div>
<div class="actions"><button id="download" class="primary">下载完整视频</button><button id="audio-export" class="secondary">只提取音频</button><a id="original" class="action" target="_blank" rel="noopener noreferrer">打开原视频</a><label class="hint">倍速<select id="rate"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
<section class="panel" id="clip-panel" hidden><h2>只下载其中一段</h2><div class="row"><label>开始<input id="clip-start" value="00:00.000" aria-label="片段开始时间"></label><button id="set-start" class="secondary" disabled>用当前位置</button><label>结束<input id="clip-end" placeholder="先播放读取时长" aria-label="片段结束时间"></label><button id="set-end" class="secondary" disabled>用当前位置</button></div><div class="actions"><button id="preview-clip" class="secondary">试看选段</button><button id="clip-export" class="primary">下载所选片段</button><span id="clip-summary" class="hint">可填秒数、分:秒或时:分:秒，支持毫秒。</span></div></section>
<section class="panel" id="text-panel" hidden><h2>只提取文案</h2><div class="row"><select id="transcript-method" aria-label="文案识别方式"><option value="auto">自动：优先字幕原文</option><option value="speech">高精度语音识别</option><option value="screen">读取画面字幕</option></select><button id="transcript-export" class="primary">提取文案 TXT</button></div><div id="ocr-options" hidden class="actions"><button id="select-roi" class="secondary">框选字幕位置</button><span id="roi-label" class="hint">未框选时自动定位下半部分字幕。先暂停在有字幕的画面，再拖框选择。</span></div><p class="hint">中文统一输出简体。自动优先平台字幕，短视频会尝试读取画面字幕；没有字幕时用语音识别。</p></section>
<div id="message" role="status"></div><p id="source-note" class="hint"></p><p class="hint">预览会联网缓冲。片段只保存所选时间范围；文案提取结束后会清理临时音视频。</p></main>
<script src="hls.js"></script><script>
const $=id=>document.getElementById(id),v=$('video'),a=$('audio');
let info,started=false,hlsPlayer,previewingClip=null,roi=null,drawing=null,selecting=false;
const readingParams=new URLSearchParams(location.search),readingRow=readingParams.get('reading-row');
if(readingRow){const params=new URLSearchParams({row:readingRow});if(readingParams.has('reading-search'))params.set('q',readingParams.get('reading-search'));$('return-reading').href='reading?'+params;$('return-reading').hidden=false;}
$('english').onchange=async()=>{try{const response=await fetch('classify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({english:$('english').checked})});if(!response.ok)throw Error(await response.text());tell($('english').checked?'已归入英语学习，提取文案时可在双语阅读页查看进度。':'已取消英语分类，已有学习文件保留。');}catch(e){tell(e.message);}};
function tell(text){$('message').textContent=text;}
function timeLabel(seconds){const ms=Math.max(0,Math.round(seconds*1000)),s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return (h?String(h).padStart(2,'0')+':':'')+String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');}
function readTime(value){const t=value.trim();if(!/^\d+(?::\d{1,2}){0,2}(?:\.\d{1,3})?$/.test(t))throw Error('请填写秒数，或 分:秒 / 时:分:秒。');const p=t.split(':').map(Number);if(p.length>1&&p.slice(1).some(x=>x>=60))throw Error('分、秒应小于 60。');return p.reduce((sum,x)=>sum*60+x,0);}
function selection(){const start=readTime($('clip-start').value),end=readTime($('clip-end').value),duration=Number.isFinite(v.duration)?v.duration:info?.duration;if(end<=start)throw Error('结束时间必须晚于开始时间。');if(duration&&end>duration+.1)throw Error('所选范围超过视频时长。');return {start,end};}
function updateSummary(){try{const r=selection();$('clip-summary').textContent='所选 '+timeLabel(r.start)+' → '+timeLabel(r.end)+'，共 '+(r.end-r.start).toFixed(3)+' 秒';}catch(e){$('clip-summary').textContent=e.message;}}
async function begin(){
 if(!info?.video)return;
 if(!started){started=true;if(info.hls&&window.Hls?.isSupported()){hlsPlayer=new Hls({maxBufferLength:20,maxMaxBufferLength:40});hlsPlayer.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)tell('视频流暂不可用，请重新解析。');});hlsPlayer.loadSource('video');hlsPlayer.attachMedia(v);}else v.src='video';if(info.audio)a.src='audio';}
 $('empty').hidden=true;$('cover').hidden=true;$('play').hidden=true;v.style.display='block';
 try{await Promise.all([v.play(),...(info.audio?[a.play()]:[])]);}catch(e){tell('播放暂未开始，请点击视频播放按钮；若仍失败，请重新解析。');}
}
$('play').onclick=begin;

function handlePreviewKey(event){
 if(event.key!=='ArrowLeft'||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.defaultPrevented||!started||!info?.video)return;
 const target=event.target;
 if(target?.isContentEditable||target?.closest?.('input,textarea,select,[role="textbox"]'))return;
 event.preventDefault();event.stopPropagation();previewingClip=null;
 const position=Math.max(0,v.currentTime-5);v.currentTime=position;
 if(info.audio)a.currentTime=position;
 tell('已后退至 '+timeLabel(position));
}
window.addEventListener('keydown',handlePreviewKey,true);

v.addEventListener('loadstart',()=>tell('正在读取视频信息并缓冲…'));
v.addEventListener('waiting',()=>tell('正在缓冲…'));
v.addEventListener('playing',()=>tell(previewingClip?'正在试看选段，到达结束时间会暂停。':'正在预览，可暂停、拖动进度或调整倍速。'));
v.addEventListener('loadedmetadata',()=>{if(!$('clip-end').value&&Number.isFinite(v.duration))$('clip-end').value=timeLabel(v.duration);$('set-start').disabled=false;$('set-end').disabled=false;updateSummary();paintRegion();});
v.addEventListener('play',()=>{if(info?.audio){a.currentTime=v.currentTime;a.play().catch(()=>tell('声音未开始，请暂停后重新播放。'));}});
v.addEventListener('pause',()=>a.pause());v.addEventListener('ended',()=>a.pause());
v.addEventListener('seeking',()=>{if(info?.audio)a.currentTime=v.currentTime;});
v.addEventListener('volumechange',()=>{a.volume=v.volume;a.muted=v.muted;});v.addEventListener('ratechange',()=>a.playbackRate=v.playbackRate);
$('rate').onchange=()=>{v.playbackRate=Number($('rate').value);a.playbackRate=v.playbackRate;};
setInterval(()=>{if(info?.audio&&!v.paused&&!v.seeking&&Math.abs(a.currentTime-v.currentTime)>.35)a.currentTime=v.currentTime;},400);
for(const media of [v,a])media.addEventListener('error',()=>tell('媒体暂时无法播放，地址可能过期或格式不兼容。请重新解析。'));
function watchClip(){if(previewingClip&&!v.seeking&&v.currentTime>=previewingClip.end-.015){const end=previewingClip.end;previewingClip=null;v.pause();v.currentTime=end;tell('选段试看结束。确认范围后可以下载。');}requestAnimationFrame(watchClip);}requestAnimationFrame(watchClip);
for(const id of ['clip-start','clip-end'])$(id).oninput=()=>{previewingClip=null;updateSummary();};
$('set-start').onclick=()=>{$('clip-start').value=timeLabel(v.currentTime);updateSummary();};$('set-end').onclick=()=>{$('clip-end').value=timeLabel(v.currentTime);updateSummary();};
$('preview-clip').onclick=async()=>{try{const r=selection();await begin();v.currentTime=r.start;previewingClip=r;await v.play();tell('正在试看选段，到达结束时间会暂停。');}catch(e){tell(e.message);}};
async function send(action,body={}){const button=$(action);button.disabled=true;try{const r=await fetch(action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){if(r.status===409)throw Error('工具仍有任务在处理，请稍后重试。');throw Error(await r.text());}tell('已交给本地视频工具处理，请在工具窗口查看进度。');}catch(e){tell(e.message||'工具连接失败，请确认工具窗口仍在运行。');}finally{button.disabled=false;}}
$('download').onclick=()=>send('download');$('audio-export').onclick=()=>send('audio-export');
$('clip-export').onclick=()=>{try{send('clip-export',selection());}catch(e){tell(e.message);}};
$('transcript-export').onclick=async()=>{if(info?.learning_enabled&&$('english').checked){try{await fetch('learning-start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roi})}).then(async r=>{if(!r.ok)throw Error(await r.text());});location.href='reading';}catch(e){tell(e.message);}return;}send('transcript-export',{method:$('transcript-method').value,roi:$('transcript-method').value==='screen'?roi:null});};
function paintRegion(){const layer=$('roi-layer');if(!$('ocr-options')||$('ocr-options').hidden||!v.videoWidth){layer.hidden=true;return;}const b=v.getBoundingClientRect(),s=$('stage').getBoundingClientRect(),ratio=v.videoWidth/v.videoHeight,w=Math.min(b.width,b.height*ratio),h=w/ratio;Object.assign(layer.style,{left:(b.left-s.left+(b.width-w)/2)+'px',top:(b.top-s.top+(b.height-h)/2)+'px',width:w+'px',height:h+'px',pointerEvents:selecting?'auto':'none'});layer.hidden=!(selecting||roi);const r=drawing?[Math.min(drawing.x,drawing.nowX),Math.min(drawing.y,drawing.nowY),Math.max(drawing.x,drawing.nowX),Math.max(drawing.y,drawing.nowY)]:roi;const box=$('roi-box');box.hidden=!r;if(r)Object.assign(box.style,{left:r[0]*100+'%',top:r[1]*100+'%',width:(r[2]-r[0])*100+'%',height:(r[3]-r[1])*100+'%'});}
function coordinate(event){const b=$('roi-layer').getBoundingClientRect();return [Math.max(0,Math.min(1,(event.clientX-b.left)/b.width)),Math.max(0,Math.min(1,(event.clientY-b.top)/b.height))];}
$('select-roi').onclick=async()=>{if(!v.videoWidth)await begin();v.pause();if(!v.videoWidth){tell('请先播放到有字幕的画面。');return;}selecting=!selecting;paintRegion();tell(selecting?'在画面上拖动，框住字幕文字。':'已退出框选。');};
$('roi-layer').onpointerdown=e=>{if(!selecting)return;const [x,y]=coordinate(e);drawing={x,y,nowX:x,nowY:y};e.currentTarget.setPointerCapture(e.pointerId);paintRegion();};
$('roi-layer').onpointermove=e=>{if(!drawing)return;[drawing.nowX,drawing.nowY]=coordinate(e);paintRegion();};
$('roi-layer').onpointerup=e=>{if(!drawing)return;const [x,y]=coordinate(e),r=[Math.min(drawing.x,x),Math.min(drawing.y,y),Math.max(drawing.x,x),Math.max(drawing.y,y)];drawing=null;if(r[2]-r[0]<.03||r[3]-r[1]<.015){tell('区域过小，请重新框选字幕。');paintRegion();return;}roi=r;selecting=false;if(info?.material_id)try{sessionStorage.setItem('subtitle-roi:'+info.material_id,JSON.stringify(roi));}catch(e){}$('roi-label').textContent='已选择字幕区域。英语学习时请框住中英两行；可重新框选。';paintRegion();tell('字幕区域已设置，可以点击“提取文案 TXT”。');};
$('roi-layer').onpointercancel=()=>{drawing=null;selecting=false;paintRegion();};
$('transcript-method').onchange=()=>{$('ocr-options').hidden=$('transcript-method').value!=='screen';selecting=false;paintRegion();};window.addEventListener('resize',paintRegion);
fetch('info').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{info=data;$('learning-nav').hidden=!data.learning_enabled;$('english').checked=!!data.english;try{roi=JSON.parse(sessionStorage.getItem('subtitle-roi:'+data.material_id)||'null');}catch(e){}document.title=data.title+' · 视频预览';$('title').textContent=data.title;$('platform').textContent=(data.platform||'视频')+' · 视频预览';if(/^https?:\/\//i.test(data.source_url))$('original').href=data.source_url;else $('original').hidden=true;$('play').hidden=!data.video;$('clip-panel').hidden=!data.video;$('text-panel').hidden=!data.video;if(!data.video){$('audio-export').hidden=true;$('download').textContent='保存图片';}if(data.duration)$('clip-end').value=timeLabel(data.duration);$('transcript-method').value=data.transcript_method||'auto';$('transcript-method').onchange();if(data.cover){const img=$('cover');img.hidden=false;img.src='cover';img.onload=()=>$('empty').hidden=true;img.onerror=()=>{img.hidden=true;$('empty').textContent='封面暂不可用，可直接播放预览。';};if(data.video)v.poster='cover';}else $('empty').textContent=data.video?'点击播放，预览视频内容':'暂无可显示的预览';$('source-note').textContent=data.note||'';updateSummary();const jump=new URLSearchParams(location.search).get('t');if(jump!==null&&/^\d+(?:\.\d+)?$/.test(jump)&&info.video){begin().then(()=>{v.currentTime=Number(jump);return v.play();}).catch(()=>tell('点击播放后可继续观看。'));}}).catch(()=>{$('title').textContent='预览已失效';$('empty').textContent='请回到工具重新解析。';$('download').disabled=true;});
window.addEventListener('pagehide',()=>{v.pause();a.pause();if(hlsPlayer)hlsPlayer.destroy();v.removeAttribute('src');a.removeAttribute('src');v.load();a.load();});
</script></html>
